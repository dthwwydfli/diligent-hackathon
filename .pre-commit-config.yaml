# Installed via: uv run prek install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types: [python]
      - id: deny-data-paths
        name: deny data / keys / traces
        entry: bash -c 'for f in "$@"; do
          case "$f" in
            data/*|*.xlsx|.env|*key*|traces/*) echo "blocked path: $f"; exit 1;;
          esac
        done'
        language: system
        pass_filenames: true
